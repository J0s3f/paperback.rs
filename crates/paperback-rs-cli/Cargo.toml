[package]
name = "paperback-rs-cli"
description = "Command-line tool to write files to paper-ready images and read them back"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
readme.workspace = true
categories = ["command-line-utilities", "encoding"]
rust-version.workspace = true

[[bin]]
name = "paperback-rs"
path = "src/main.rs"
# The library has the same name; its documentation is the one worth building.
doc = false

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
paperback-rs = { path = "../paperback-rs" }
serde_json = "1.0.151"
