[package]
name = "paperback-rs"
description = "Store files on paper as dense, error-corrected bitmaps; compatible with PaperBack 1.10"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
readme.workspace = true
categories = ["encoding", "multimedia::images"]
rust-version.workspace = true
# crates.io allows 10 MB per crate; the scans (about 17 MB) stay in the repository, and the tests skip
# cases without scans.
exclude = ["tests/fixtures/realworld/scans/*"]

[lints]
workspace = true

[dependencies]
aes = "0.9.2"
bzip2 = "0.6.1"
cbc = "0.2.1"
crc = "3.4.0"
fax = "0.3.0"
font8x8 = "0.3.1"
getrandom = "0.4.3"
hayro-jbig2 = "0.3.1"
hayro-jpeg2000 = "0.4.1"
hmac = "0.13.0"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "bmp"] }
lopdf = { version = "0.42.0", default-features = false }
miniz_oxide = "0.9.1"
pbkdf2 = "0.13.0"
pdf-writer = "0.15.0"
png = "0.18.1"
sha2 = "0.11.0"
thiserror = "2.0.21"
